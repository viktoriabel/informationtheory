<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 3 — Hamming Code — IT by Viktoriabel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #24292f;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Навигация */
        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 15px;
        }
        .nav h1 { font-size: 1.2em; margin: 0; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #0969da; }
        .nav-links a:hover { text-decoration: underline; }

        /* Заголовки */
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 5px 0; font-size: 2em; }
        .header p { margin: 0; color: #57606a; font-size: 0.9em; }

        /* Контейнер для диаграммы */
        .diagram-container {
            position: relative;
            width: 500px;
            height: 450px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #ffffff;
            margin-bottom: 20px;
        }

        /* Круги Венна */
        .circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #24292f;
            opacity: 0.4;
            mix-blend-mode: multiply; 
        }

        .circle-red { width: 280px; height: 280px; left: 110px; top: 20px; background-color: #f8d7da; }
        .circle-blue { width: 280px; height: 280px; left: 30px; top: 140px; background-color: #cce5ff; }
        .circle-green { width: 280px; height: 280px; left: 190px; top: 140px; background-color: #d4edda; }

        /* Поля ввода */
        .bit-input {
            position: absolute;
            width: 36px;
            height: 36px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            background: white;
            z-index: 10;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .bit-input:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.2);
        }

        /* Позиции полей ввода */
        .pos-top { left: 232px; top: 70px; }      /* Бит 1 (s1) */
        .pos-left { left: 90px; top: 250px; }     /* Бит 2 (s2) */
        .pos-right { left: 374px; top: 250px; }   /* Бит 3 (s3) */
        .pos-center { left: 232px; top: 200px; }  /* Бит 4 */
        
        .pos-c1 { left: 160px; top: 180px; }      /* Бит 5 (s1+s2) */
        .pos-c2 { left: 304px; top: 180px; }      /* Бит 6 (s1+s3) */
        .pos-c3 { left: 232px; top: 290px; }      /* Бит 7 (s2+s3) */

        /* Кнопки и текст ошибки */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-test { background-color: #0969da; color: white; }
        .btn-test:hover { background-color: #0860ca; }
        
        .btn-clear { background-color: #6e7781; color: white; }
        .btn-clear:hover { background-color: #5c636a; }

        .btn-back { 
            background-color: #f6f8fa; 
            color: #24292f; 
            border-color: #d0d7de; 
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover { background-color: #f3f4f6; }

        /* Текст ошибки */
        .error-text {
            color: #cf222e; /* Красный цвет */
            font-weight: bold;
            font-size: 16px;
            height: 20px; /* Чтобы блок не прыгал */
            margin-top: 5px;
        }

        /* Подсветка полей с ошибкой */
        .error-highlight {
            border: 2px solid #cf222e !important;
            background-color: #ffebe9 !important;
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Viktoriabel</h1>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="project3.html">Project 3</a>
        </div>
    </div>

    <div class="header">
        <h2>Project 3</h2>
        <p>Hamming Code</p>
    </div>

    <div class="diagram-container" id="diagram">
        <div class="circle circle-red"></div>
        <div class="circle circle-blue"></div>
        <div class="circle circle-green"></div>

        <!-- Порядок важен для скрипта, индексы 0-6 -->
        <input type="text" class="bit-input pos-top" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-left" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-right" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-center" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-c1" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-c2" maxlength="1" oninput="filterInput(this)">
        <input type="text" class="bit-input pos-c3" maxlength="1" oninput="filterInput(this)">
    </div>

    <div class="controls">
        <div class="btn-group">
            <button class="btn btn-test" onclick="testHamming()">Test</button>
            <button class="btn btn-clear" onclick="clearAll()">Clear</button>
        </div>
        <!-- Блок для вывода текста ошибки -->
        <div class="error-text" id="errorMessage"></div>
    </div>

    <a href="../index.html" class="btn btn-back">Back to Home</a>

    <script>
        // Фильтр ввода (только 0 и 1)
        function filterInput(input) {
            input.value = input.value.replace(/[^01]/g, '');
            input.classList.remove('error-highlight');
            // Очищаем текст ошибки при изменении данных
            document.getElementById('errorMessage').textContent = '';
        }

        // Очистка всех полей
        function clearAll() {
            const inputs = document.querySelectorAll('.bit-input');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('error-highlight');
            });
            document.getElementById('errorMessage').textContent = '';
        }

        // Проверка кода Хэмминга
        function testHamming() {
            const inputs = document.querySelectorAll('.bit-input');
            const errorMsg = document.getElementById('errorMessage');
            
            inputs.forEach(input => input.classList.remove('error-highlight'));
            errorMsg.textContent = '';

            // Собираем значения (пустые поля считаются за 0)
            let bits = Array.from(inputs).map(input => input.value === '1' ? 1 : 0);

            // Вычисляем четность для трех кругов
            // s1 (Верхний круг): биты 1, 5, 6, 4 (индексы 0, 4, 5, 3)
            let s1 = (bits[0] + bits[4] + bits[5] + bits[3]) % 2;
            
            // s2 (Левый круг): биты 2, 5, 7, 4 (индексы 1, 4, 6, 3)
            let s2 = (bits[1] + bits[4] + bits[6] + bits[3]) % 2;
            
            // s3 (Правый круг): биты 3, 6, 7, 4 (индексы 2, 5, 6, 3)
            let s3 = (bits[2] + bits[5] + bits[6] + bits[3]) % 2;

            let errors = [];

            // Если остаток от деления на 2 не равен 0, значит ошибка (нечетное число единиц)
            if (s1 !== 0) {
                errors.push("s1");
                // Подсвечиваем биты, входящие в s1
                inputs[0].classList.add('error-highlight');
                inputs[4].classList.add('error-highlight');
                inputs[5].classList.add('error-highlight');
                inputs[3].classList.add('error-highlight');
            }
            if (s2 !== 0) {
                errors.push("s2");
                // Подсвечиваем биты, входящие в s2
                inputs[1].classList.add('error-highlight');
                inputs[4].classList.add('error-highlight');
                inputs[6].classList.add('error-highlight');
                inputs[3].classList.add('error-highlight');
            }
            if (s3 !== 0) {
                errors.push("s3");
                // Подсвечиваем биты, входящие в s3
                inputs[2].classList.add('error-highlight');
                inputs[5].classList.add('error-highlight');
                inputs[6].classList.add('error-highlight');
                inputs[3].classList.add('error-highlight');
            }

            // Формируем текст сообщения
            if (errors.length === 0) {
                errorMsg.style.color = "#2da44e"; // Зеленый для успеха
                errorMsg.textContent = "No errors";
            } else {
                errorMsg.style.color = "#cf222e"; // Красный для ошибки
                // Склеиваем массив ошибок через запятую или "and"
                errorMsg.textContent = "Error in " + errors.join(", ");
            }
        }
    </script>

</body>
</html>
