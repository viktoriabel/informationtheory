<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1 — ABBA — IT by Viktoria Abakunchik</title>
    <!-- Подключаем современные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Базовые стили и фон --- */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            background-attachment: fixed;
        }

        /* --- Навигация сверху --- */
        .nav {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            box-sizing: border-box;
        }
        
        .nav h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 1.3em; 
            margin: 0; 
            color: #0f172a;
        }
        
        .nav-links a { 
            margin-left: 20px; 
            text-decoration: none; 
            color: #4f46e5; 
            font-weight: 600;
            font-size: 0.95em;
            transition: color 0.2s;
        }
        
        .nav-links a:hover { 
            color: #ec4899;
            text-decoration: underline; 
        }

        /* --- Основное окно калькулятора --- */
        .calculator-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .calculator-box h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .calculator-box p {
            color: #64748b;
            font-size: 1.05em;
            margin-bottom: 25px;
        }

        /* --- Поле ввода --- */
        input[type="text"] {
            width: 85%;
            padding: 15px 20px;
            font-size: 18px;
            font-family: 'Inter', sans-serif;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background-color: #ffffff;
            color: #0f172a;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        /* --- Стильный подвал (Footer) --- */
        .site-footer {
            margin-top: 40px;
            padding: 20px 30px;
            text-align: center;
            font-size: 0.95em;
            font-weight: 500;
            color: #475569;
            /* Эффект стекла, как у карточек */
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            letter-spacing: 0.5px;
        }
        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* --- Блок с результатами --- */
        .results {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 1.2em;
            margin-top: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .result-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .number {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            color: #4f46e5;
            line-height: 1;
            margin-bottom: 5px;
        }

        .label {
            font-size: 0.85em;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .multiply {
            font-size: 1.8em;
            color: #cbd5e1;
            padding-top: 5px;
        }

        /* Специфичный цвет для итогового результата */
        #finalResult {
            color: #ec4899 !important; /* Розовый акцент для результата */
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Viktoria Abakunchik</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>

    <div class="calculator-box">
        <h2>ABBA Calculation</h2>
        <p>Enter a word or sentence:</p>
        
        <input type="text" id="inputText" placeholder="Type here..." oninput="calculateABBA()">
        
        <div class="results">
            <div class="result-item">
                <span class="number" id="vowelCount">0</span>
                <span class="label">vowels!</span>
            </div>
            
            <div class="multiply">×</div>
            
            <div class="result-item">
                <span class="number" id="consonantCount">0</span>
                <span class="label">consonants!</span>
            </div>

            <div class="multiply">=</div>

            <div class="result-item">
                <span class="number" id="finalResult">0</span>
                <span class="label">result</span>
            </div>
        </div>
    </div>

    <script>
        function calculateABBA() {
            const text = document.getElementById('inputText').value.toLowerCase();
            
            // Регулярное выражение для гласных (английские и русские)
            const vowelsMatch = text.match(/[aeiouyаеёиоуыэюя]/g);
            // Регулярное выражение для согласных
            const consonantsMatch = text.match(/[bcdfghjklmnpqrstvwxzбвгджзйклмнпрстфхцчшщ]/g);

            const vowels = vowelsMatch ? vowelsMatch.length : 0;
            const consonants = consonantsMatch ? consonantsMatch.length : 0;
            
            // Умножаем количество гласных на количество согласных
            const result = vowels * consonants;

            // Выводим результат на экран
            document.getElementById('vowelCount').textContent = vowels;
            document.getElementById('consonantCount').textContent = consonants;
            document.getElementById('finalResult').textContent = result;
        }
    </script>
           <!-- Стильный подвал в общем дизайне -->
        <footer class="site-footer">
            © 2026 IT by Viktoria Abakunchik
        </footer>
    </div> <!-- Закрывающий тег контейнера -->
</body>
</body>
</html>
