<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <style>

            color: #24292f;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav {
            width: 100%;
            max-width: 600px;

            justify-content: space-between;

            margin-bottom: 30px;

            padding-bottom: 15px;
        }
        .nav h1 { font-size: 1.2em; margin: 0; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #0969da; }
        .nav-links a:hover { text-decoration: underline; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0 0 5px 0; font-size: 2em; }
        .header p { margin: 0; color: #57606a; font-size: 0.9em; }

        /* Общие стили для карточек */
        .card {
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 1px 3px rgba(27,31,36,0.04);
        }

        .card h3 { margin-top: 0; font-size: 1.3em; }
        .formula-text { font-size: 1.2em; margin: 10px 0 20px 0; font-style: italic; }
        .sub-text { font-size: 0.85em; color: #57606a; margin-bottom: 20px; }

        /* Стили для ввода */
        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .input-group input {
            width: 80px;
            padding: 8px;

            border: 1px solid #d0d7de;

        }
        .btn-calc {
            background-color: #0969da;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-calc:hover { background-color: #0860ca; }
        
        .result-display {
            margin-top: 15px;
            font-size: 1.5em;
            font-weight: bold;
            color: #0969da;
            min-height: 30px;
        }

        /* Стили для Энтропии Шеннона */
        .prob-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .prob-inputs input {
            width: 50px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Viktoria Abakunchik</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>

    <div class="header">
        <h2>Project 4</h2>
        <p>LB(N) and Shannon entropy</p>
    </div>

    <!-- Блок 1: Бинарный алгоритм -->
    <div class="card">
        <h3>Binary algorithm</h3>
        <div class="formula-text">H = K &middot; LB(N)</div>
        <div class="sub-text">LB(N) is the base-2 logarithm of the number of symbol sequences.</div>
        
        <div class="input-group">
            <span>LB(</span>
            <input type="number" id="lbInput" placeholder="N" min="1">
            <span>) =</span>
            <button class="btn-calc" onclick="calculateLB()">=</button>
        </div>
        <div class="result-display" id="lbResult"></div>
    </div>

    <!-- Блок 2: Энтропия Шеннона -->
    <div class="card">
        <h3>Shannon entropy</h3>
        
        <!-- Формула Шеннона через MathJax -->
        <div style="font-size: 1.5em; margin: 20px 0;">
            \[ S(x) = \sum_{i=1}^{n} p(i) \log_2 \frac{1}{p(i)} \]
        </div>

        <div class="prob-inputs">
            <input type="number" class="prob-input" value="50" min="0" max="100" step="any">
            <input type="number" class="prob-input" value="25" min="0" max="100" step="any">
            <input type="number" class="prob-input" value="12.5" min="0" max="100" step="any">
            <input type="number" class="prob-input" value="12.5" min="0" max="100" step="any">
        </div>
        
        <button class="btn-calc" onclick="calculateShannon()">Calculate</button>
        <div class="result-display" id="shannonResult"></div>

        <!-- Визуальная часть (Одна картинка с наложенным текстом) -->
        <div style="margin-top: 30px;">
            <div style="
                position: relative; 
                width: 100%; 
                height: 350px; /* Жестко задаем высоту блока */
                border-radius: 6px; 
                overflow: hidden;
                background-color: #0d47a1;
            ">
                <!-- object-fit: cover заставит картинку заполнить блок без искажений -->
                <img src="shannon.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center;">
                
                <!-- Затемнение для читаемости текста -->
                <div style="
                    position: absolute; 
                    top: 0; left: 0; width: 100%; height: 100%; 
                    background: linear-gradient(to right, rgba(13, 71, 161, 0.8), rgba(46, 125, 50, 0.5));
                "></div>

                <!-- Текст поверх фото -->
                <div style="
                    position: absolute; 
                    top: 0; left: 0; width: 100%; height: 100%; 
                    display: flex; justify-content: center; align-items: center; 
                    box-sizing: border-box; color: white;
                ">
                    <div style="font-size: 1.8em; font-weight: bold; text-align: center; line-height: 1.2; text-shadow: 2px 2px 5px rgba(0,0,0,0.8);">
                        PROJECT 4<br>Shannon Entropy
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка возврата -->
    <a href="index.html" class="btn-calc" style="background-color: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; text-decoration: none; margin-top: 10px; display: inline-block; padding: 10px 20px;">Back to Home</a>

    <script>
        // --- Логика для бинарного алгоритма (LB) ---
        function calculateLB() {
            const n = parseFloat(document.getElementById('lbInput').value);
            const resultEl = document.getElementById('lbResult');

            if (isNaN(n) || n <= 0) {
                resultEl.textContent = "Please enter N > 0";
                return;
            }

            const lb = Math.log2(n);
            resultEl.textContent = lb.toFixed(3);
        }

        // --- Логика для Энтропии Шеннона ---
        function calculateShannon() {
            const inputs = document.querySelectorAll('.prob-input');
            const resultEl = document.getElementById('shannonResult');
            
            let probabilities = [];
            let sum = 0;

            inputs.forEach(input => {
                let val = parseFloat(input.value);
                if (isNaN(val) || val < 0) val = 0;
                if (val > 100) val = 100; 
                
                probabilities.push(val / 100);
                sum += (val / 100);
            });

            if (Math.abs(sum - 1) > 0.01) {
                resultEl.textContent = "Sum must be 100%";
                return;
            }

            let entropy = 0;
            probabilities.forEach(p => {
                if (p > 0) {
                    entropy -= p * Math.log2(p);
                }
            });

            resultEl.textContent = entropy.toFixed(3) + " bits";
        }
    </script>

</body>
</html>
