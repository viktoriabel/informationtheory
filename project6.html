<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 6 — Nash Equilibrium — IT by Viktoriabel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa; /* Светло-серый фон */
            color: #24292f;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #d0d7de;
        }
        .nav h1 { font-size: 1.2em; margin: 0; font-weight: 600; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #24292f; font-size: 0.9em; border: 1px solid #d0d7de; padding: 4px 10px; border-radius: 4px; }
        .nav-links a:hover { background-color: #eaeef2; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0 0 5px 0; font-size: 2.2em; font-weight: 500; }
        .header p { margin: 0; color: #57606a; font-size: 0.95em; }

        /* Кнопка запуска */
        .btn-run {
            background-color: #0969da;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
            box-shadow: 0 1px 3px rgba(27,31,36,0.12);
        }
        .btn-run:hover { background-color: #0860ca; }

        /* Основная сетка */
        .content-wrapper {
            width: 100%;
            max-width: 800px;
        }

        /* Блоки с результатами (Решения и Проверка) */
        .panels-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            flex: 1;
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(27,31,36,0.04);
        }

        .panel-header {
            padding: 10px 15px;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .bg-blue { background-color: #007bff; }
        .bg-green { background-color: #28a745; }
        .bg-dark { background-color: #343a40; }

        .panel-body {
            padding: 15px;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .panel-body p { margin: 5px 0; }
        .bold-text { font-weight: bold; color: #24292f; }

        /* Блок итогового результата */
        .result-panel {
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 1px 3px rgba(27,31,36,0.04);
        }

        .result-body {
            padding: 30px 15px;
            text-align: center;
            font-size: 1.05em;
            color: #2da44e; /* Зеленый цвет текста результата */
        }

        .btn-back { 
            background-color: #f6f8fa; 
            color: #24292f; 
            border: 1px solid #d0d7de; 
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            display: inline-block;
        }
        .btn-back:hover { background-color: #eaeef2; }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Viktoriabel</h1>
        <div class="nav-links">
            <a href="../index.html">Home</a>
        </div>
    </div>

    <div class="header">
        <h2>Project 6</h2>
        <p>Nash Equilibrium &middot; Prisoner's Dilemma</p>
    </div>

    <button class="btn-run" onclick="runSimulation()">Run Simulation</button>

    <div class="content-wrapper">
        <!-- Две колонки: Decisions и Betrayal Check -->
        <div class="panels-row">
            
            <!-- Левая панель: Решения -->
            <div class="panel">
                <div class="panel-header bg-blue">Decisions</div>
                <div class="panel-body">
                    <p><span class="bold-text">Person A</span></p>
                    <p>Admits guilt: <span id="decisionA">-</span></p>
                    <br>
                    <p><span class="bold-text">Person B</span></p>
                    <p>Admits guilt: <span id="decisionB">-</span></p>
                </div>
            </div>

            <!-- Правая панель: Проверка на предательство -->
            <div class="panel">
                <div class="panel-header bg-green">Betrayal Check</div>
                <div class="panel-body">
                    <p><span class="bold-text">Person A</span></p>
                    <p>Betrays partner: <span id="betrayalA">-</span></p>
                    <br>
                    <p><span class="bold-text">Person B</span></p>
                    <p>Betrays partner: <span id="betrayalB">-</span></p>
                </div>
            </div>

        </div>

        <!-- Нижняя панель: Итог -->
        <div class="result-panel">
            <div class="panel-header bg-dark" style="text-align: center;">Simulation Result</div>
            <div class="result-body" id="finalResult">
                Click "Run Simulation" to see the result.
            </div>
        </div>
    </div>

    <a href="../index.html" class="btn-back">Back to Home</a>

    <script>
        function runSimulation() {
            // 1. Симуляция решений (случайно YES или NO)
            // Math.random() > 0.5 дает 50% шанс для каждого
            const admitsA = Math.random() > 0.5;
            const admitsB = Math.random() > 0.5;

            // Обновляем текст в первой панели
            document.getElementById('decisionA').textContent = admitsA ? 'YES' : 'NO';
            document.getElementById('decisionB').textContent = admitsB ? 'YES' : 'NO';

            // 2. Проверка на предательство
            // В дилемме заключенного: если ты признаешься (YES), значит ты предаешь партнера.
            const betraysA = admitsA;
            const betraysB = admitsB;

            document.getElementById('betrayalA').textContent = betraysA ? 'YES' : 'NO';
            document.getElementById('betrayalB').textContent = betraysB ? 'YES' : 'NO';

            // 3. Логика формирования итогового результата
            const resultEl = document.getElementById('finalResult');
            let resultText = '';
            let color = '#2da44e'; // По умолчанию зеленый

            if (betraysA && betraysB) {
                // Оба признались
                resultText = "Both criminals betrayed the partner.";
                color = '#cf222e'; // Красный (оба получили срок)
            } else if (!betraysA && !betraysB) {
                // Оба молчат
                resultText = "Both criminals remained silent. They get a lighter sentence.";
                color = '#0969da'; // Синий
            } else if (betraysA && !betraysB) {
                // А признался, Б молчит
                resultText = "Person A betrayed Person B. Person A goes free, Person B gets the maximum sentence.";
                color = '#cf222e';
            } else if (!betraysA && betraysB) {
                // Б признался, А молчит
                resultText = "Person B betrayed Person A. Person B goes free, Person A gets the maximum sentence.";
                color = '#cf222e';
            }

            resultEl.textContent = resultText;
            resultEl.style.color = color;
        }
    </script>

</body>
</html>
