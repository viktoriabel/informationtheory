<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 — Boolean logic — IT by Viktoriabel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Навигация */
        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 15px;
        }
        .nav h1 { font-size: 1.2em; margin: 0; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #0969da; }
        .nav-links a:hover { text-decoration: underline; }

        /* Основное окно */
        .calculator-box {
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(27,31,36,0.04);
        }

        h2 { margin-top: 0; }
        p.subtitle { color: #57606a; margin-bottom: 25px; }

        /* Контейнер для 7 квадратиков */
        .bits-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        /* Стили для каждого квадратика ввода */
        .bit-input {
            width: 45px;
            height: 55px;
            font-size: 24px;
            font-family: monospace;
            text-align: center;
            border: 2px solid #d0d7de;
            border-radius: 6px;
            background-color: #f6f8fa;
            transition: all 0.2s ease;
        }

        /* Подсветка при фокусе (когда на него нажали) */
        .bit-input:focus {
            outline: none;
            border-color: #0969da;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }

        /* Блок с результатом */
        .result-box {
            padding: 20px;
            background-color: #f6f8fa;
            border-radius: 6px;
            border: 1px solid #d0d7de;
        }

        .result-label {
            font-size: 1em;
            color: #57606a;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 3em;
            font-weight: bold;
            color: #0969da;
            font-family: monospace;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Viktoriabel</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="project2.html">Project 2</a>
        </div>
    </div>

    <div class="calculator-box">
        <h2>Boolean logic</h2>
        <p class="subtitle">Seven bits. Index is their parity.</p>
        
        <!-- 7 полей для ввода битов -->
        <div class="bits-container" id="bitsContainer">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 0)" onkeydown="handleKeyDown(event, this, 0)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 1)" onkeydown="handleKeyDown(event, this, 1)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 2)" onkeydown="handleKeyDown(event, this, 2)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 3)" onkeydown="handleKeyDown(event, this, 3)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 4)" onkeydown="handleKeyDown(event, this, 4)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 5)" onkeydown="handleKeyDown(event, this, 5)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 6)" onkeydown="handleKeyDown(event, this, 6)">
        </div>
        
        <div class="result-box">
            <div class="result-label">Index (Parity Bit)</div>
            <div class="result-value" id="parityResult">-</div>
        </div>
    </div>

    <script>
        // При загрузке страницы ставим курсор в первое окошко
        window.onload = function() {
            document.querySelector('.bit-input').focus();
        };

        // Функция для фильтрации ввода (разрешаем только 0 и 1)
        function handleInput(inputElement, index) {
            // Удаляем всё, кроме 0 и 1
            inputElement.value = inputElement.value.replace(/[^01]/g, '');
            
            // Если пользователь ввел цифру, переводим курсор на следующее поле автоматически
            if (inputElement.value !== "" && index < 6) {
                const inputs = document.querySelectorAll('.bit-input');
                inputs[index + 1].focus();
            }

            // Проверяем, заполнены ли все 7 полей
            checkAndCalculate();
        }

        // Обработка нажатия клавиш (чтобы можно было стирать Backspace)
        function handleKeyDown(event, inputElement, index) {
            // Если нажат Backspace и поле пустое, переводим курсор назад
            if (event.key === 'Backspace' && inputElement.value === '' && index > 0) {
                const inputs = document.querySelectorAll('.bit-input');
                inputs[index - 1].focus();
                // Удаляем символ в предыдущем поле
                inputs[index - 1].value = '';
                checkAndCalculate();
            }
        }

        // Функция подсчета четности
        function checkAndCalculate() {
            const inputs = document.querySelectorAll('.bit-input');
            let values = [];
            let allFilled = true;

            // Собираем значения из всех полей
            inputs.forEach(input => {
                if (input.value === '') {
                    allFilled = false;
                } else {
                    values.push(input.value);
                }
            });

            const resultElement = document.getElementById('parityResult');

            // Если все 7 бит введены, считаем результат
            if (allFilled && values.length === 7) {
                let onesCount = 0;
                values.forEach(bit => {
                    if (bit === '1') onesCount++;
                });

                // Если единиц нечетное количество, бит четности (Index) будет 1
                let parityBit = (onesCount % 2 !== 0) ? '1' : '0';
                resultElement.textContent = parityBit;
            } else {
                // Если не все биты введены, показываем прочерк
                resultElement.textContent = '-';
            }
        }
    </script>

</body>
</html>
