<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 — Boolean logic — IT by Viktoria Abakunchik</title>
    <!-- Подключаем современные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Базовые стили и фон --- */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            background-attachment: fixed;
        }

        /* --- Навигация сверху --- */
        .nav {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            box-sizing: border-box;
        }
        
        .nav h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 1.3em; 
            margin: 0; 
            color: #0f172a;
        }
        
        .nav-links a { 
            margin-left: 20px; 
            text-decoration: none; 
            color: #4f46e5; 
            font-weight: 600;
            font-size: 0.95em;
            transition: color 0.2s;
        }
        
        .nav-links a:hover { 
            color: #ec4899;
            text-decoration: underline; 
        }

        /* --- Основное окно --- */
        .calculator-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            color: #0f172a;
            margin-top: 0; 
            margin-bottom: 10px;
        }
        
        p.subtitle { 
            color: #64748b; 
            font-size: 1.05em;
            margin-bottom: 30px; 
        }

        /* --- Контейнер для 7 квадратиков --- */
        .bits-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        /* --- Поля ввода битов --- */
        .bit-input {
            width: 50px;
            height: 60px;
            font-size: 26px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background-color: #ffffff;
            color: #0f172a;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* Подсветка при фокусе */
        .bit-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            transform: translateY(-2px);
        }

        /* --- Блок с результатом --- */
        .result-box {
            padding: 25px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .result-label {
            font-size: 0.95em;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .result-value {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em;
            font-weight: 600;
            color: #ec4899; /* Розовый акцент, как на главной */
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
        }

        /* --- Стильный подвал (Footer) --- */
        .site-footer {
            width: 100%;
            max-width: 650px;
            margin-top: 20px;
            padding: 20px 30px;
            text-align: center;
            font-size: 0.9em;
            font-weight: 500;
            color: #475569;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            letter-spacing: 0.5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="nav">
        <h1>IT by Viktoria Abakunchik</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </div>

    <div class="calculator-box">
        <h2>Boolean logic</h2>
        <p class="subtitle">Seven bits. Index is their parity.</p>
        
        <!-- 7 полей для ввода битов -->
        <div class="bits-container" id="bitsContainer">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 0)" onkeydown="handleKeyDown(event, this, 0)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 1)" onkeydown="handleKeyDown(event, this, 1)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 2)" onkeydown="handleKeyDown(event, this, 2)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 3)" onkeydown="handleKeyDown(event, this, 3)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 4)" onkeydown="handleKeyDown(event, this, 4)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 5)" onkeydown="handleKeyDown(event, this, 5)">
            <input type="text" class="bit-input" maxlength="1" oninput="handleInput(this, 6)" onkeydown="handleKeyDown(event, this, 6)">
        </div>
        
        <div class="result-box">
            <div class="result-label">Index (Parity Bit)</div>
            <div class="result-value" id="parityResult">-</div>
        </div>
    </div>

    <!-- Стильный подвал -->
    <footer class="site-footer">
        © 2026 IT by Viktoria Abakunchik
    </footer>

    <script>
        // При загрузке страницы ставим курсор в первое окошко
        window.onload = function() {
            document.querySelector('.bit-input').focus();
        };

        // Функция для фильтрации ввода (разрешаем только 0 и 1)
        function handleInput(inputElement, index) {
            // Удаляем всё, кроме 0 и 1
            inputElement.value = inputElement.value.replace(/[^01]/g, '');
            
            // Если пользователь ввел цифру, переводим курсор на следующее поле автоматически
            if (inputElement.value !== "" && index < 6) {
                const inputs = document.querySelectorAll('.bit-input');
                inputs[index + 1].focus();
            }

            // Проверяем, заполнены ли все 7 полей
            checkAndCalculate();
        }

        // Обработка нажатия клавиш (чтобы можно было стирать Backspace)
        function handleKeyDown(event, inputElement, index) {
            // Если нажат Backspace и поле пустое, переводим курсор назад
            if (event.key === 'Backspace' && inputElement.value === '' && index > 0) {
                const inputs = document.querySelectorAll('.bit-input');
                inputs[index - 1].focus();
                // Удаляем символ в предыдущем поле
                inputs[index - 1].value = '';
                checkAndCalculate();
            }
        }

        // Функция подсчета четности
        function checkAndCalculate() {
            const inputs = document.querySelectorAll('.bit-input');
            let values = [];
            let allFilled = true;

            // Собираем значения из всех полей
            inputs.forEach(input => {
                if (input.value === '') {
                    allFilled = false;
                } else {
                    values.push(input.value);
                }
            });

            const resultElement = document.getElementById('parityResult');

            // Если все 7 бит введены, считаем результат
            if (allFilled && values.length === 7) {
                let onesCount = 0;
                values.forEach(bit => {
                    if (bit === '1') onesCount++;
                });

                // Если единиц нечетное количество, бит четности (Index) будет 1
                let parityBit = (onesCount % 2 !== 0) ? '1' : '0';
                resultElement.textContent = parityBit;
            } else {
                // Если не все биты введены, показываем прочерк
                resultElement.textContent = '-';
            }
        }
    </script>

</body>
</html>
