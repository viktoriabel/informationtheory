<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT by Viktoria Abakunchik</title>
    <!-- Подключаем современный шрифт Inter и Playfair Display для заголовков -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Базовые стили и анимированный фон --- */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            /* Красивый градиентный фон, который переливается */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 850px;
            width: 100%;
            /* Эффект "стекла" для всего контейнера */
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        /* --- Шапка профиля --- */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-bottom: 30px;
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .profile-photo-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .profile-photo {
            width: 170px; 
            height: 170px; 
            border-radius: 50%;
            object-fit: cover; 
            border: 4px solid #ffffff; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); 
            background-color: #e5e7eb;
            position: relative;
            z-index: 2;
        }

        /* Декоративное свечение вокруг фото */
        .profile-photo-wrapper::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            background: linear-gradient(45deg, #6366f1, #ec4899, #8b5cf6);
            border-radius: 50%;
            z-index: 1;
            filter: blur(10px);
            opacity: 0.6;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5em; 
            margin: 0;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .tn {
            font-size: 0.95em;
            color: #475569;
            margin: 0;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .tn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 5px;
        }

        /* --- Кнопка Notes --- */
        .btn-notes {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 50px; /* Овальная кнопка */
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-notes:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        /* --- Сетка проектов --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        /* --- Карточка проекта --- */
        .project-card {
            background-color: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* Красивая полоска сверху карточки, которая появляется при наведении */
        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
            border-color: #e2e8f0;
        }

        .project-card:hover::before {
            transform: scaleX(1); /* Полоска выезжает при наведении */
        }

        .project-card h2 {
            font-size: 1.3em;
            margin-top: 0;
            margin-bottom: 8px;
            color: #0f172a;
            font-weight: 600;
        }

        .project-card p {
            margin: 0 0 24px 0;
            color: #64748b;
            font-size: 0.95em;
            flex-grow: 1; 
            line-height: 1.6;
        }

        /* --- Кнопка Open --- */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #4f46e5;
            background-color: #eef2ff;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s;
            text-align: center;
            align-self: flex-start; 
        }

        .btn:hover {
            background-color: #4f46e5;
            color: #ffffff;
            transform: translateX(4px); /* Кнопка немного сдвигается вправо */
        }
    </style>
</head>
<body>

    <div class="container">
    
        <!-- Шапка с фото, именем и кнопкой Notes -->
        <div class="profile-header">
            <div class="profile-photo-wrapper">
                <img src="me.jpg" alt="My Photo" class="profile-photo">
            </div>
            
            <h1>IT by Viktoria Abakunchik</h1>
            
            <div class="tn-group">
                <p class="tn">Group 1451</p>
                <p class="tn">Teacher: Andrey O. Yaroshevich</p>
            </div>
            
            <!-- Кнопка Notes -->
            <a href="notes.html" class="btn-notes">Notes</a>
        </div>
       
        <!-- Сетка проектов -->
        <div class="projects-grid">
            <!-- Проект 1 -->
            <div class="project-card">
                <h2>Project 1</h2>
                <p>ABBA Calculation</p>
                <a href="project1.html" class="btn">Open</a>
            </div>

            <!-- Проект 2 -->
            <div class="project-card">
                <h2>Project 2</h2>
                <p>Boolean logic</p>
                <a href="project2.html" class="btn">Open</a>
            </div>

            <!-- Проект 3 -->
            <div class="project-card">
                <h2>Project 3</h2>
                <p>Hamming Code</p>
                <a href="project3.html" class="btn">Open</a>
            </div>

            <!-- Проект 4 -->
            <div class="project-card">
                <h2>Project 4</h2>
                <p>LB(N) and Shannon</p>
                <a href="project4.html" class="btn">Open</a>
            </div>

            <!-- Проект 5 -->
            <div class="project-card">
                <h2>Project 5</h2>
                <p>WOW/BOW Generator</p>
                <a href="project5.html" class="btn">Open</a>
            </div>

            <!-- Проект 6 -->
            <div class="project-card">
                <h2>Project 6</h2>
                <p>Nash Equilibrium</p>
                <a href="project6.html" class="btn">Open</a>
            </div>
        </div>

    </div>

</body>
</html>
